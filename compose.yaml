# Docker Compose relie les services sur un réseau privé par défaut.
services:
  # PostgreSQL conserve les données scolaires dans un volume persistant.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iai_portal
      POSTGRES_USER: iai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U iai -d iai_portal']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  # Le backend n'est accessible que depuis les autres services Docker.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Portal: Host=postgres;Database=iai_portal;Username=iai;Password=${POSTGRES_PASSWORD}
      Bootstrap__Username: ${ADMIN_USERNAME:-admin}
      Bootstrap__Password: ${ADMIN_PASSWORD:?Définissez ADMIN_PASSWORD dans .env}
      Bootstrap__MfaSecret: ${ADMIN_MFA_SECRET:?Définissez ADMIN_MFA_SECRET dans .env}
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    volumes:
      - document_data:/app/storage
      - cookie_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  # Nuxt sert l'interface et relaie les requêtes API sur la même origine.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
  # Nginx termine HTTPS et protège les cookies Secure.
  nginx:
    image: nginx:stable-alpine
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
    restart: unless-stopped
# Ces volumes survivent au remplacement des conteneurs.
volumes:
  postgres_data:
  document_data:
  cookie_keys:
